<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Welcome</title>
</head>
<style type="text/css">
	body {
        font-family: Arial, sans-serif;
        text-align: center;
        background: linear-gradient(135deg, #4A90E2, #50E3C2);
        color: white;
        padding: 50px;
	} 
	.container {
		background: white;
		color: black;
		padding: 20px;
		border-radius: 10px;
		box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
		display: inline-block;
	}
    h1 {
    	color: #4A90E2;
    }
    button {
    	background: #4A90E2;
    	color: white;
    	padding: 10px 20px;
    	border: none;
    	cursor: pointer;
    	border-radius: 5px;
    	font-size: 16px;
    }
    button:hover {
    	background: #357ABD;
    }
</style>
<body>
<div class="container">
   <h1>Welcome</h1>
   <p>You have successfully logged in.</p>
   <button onclick="logout()">Logout</button>	
</div>

<script type="text/javascript">
	function logout() {
		window.location.href = "ADD YOUR GOOGLE APPS SCRIPT URL HERE"; // Change this to your login page URL
	} 
</script>
</body>
</html>
