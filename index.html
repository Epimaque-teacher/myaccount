<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Secure Login and Register</title>
</head>
<style type="text/css">
	/* General Styling */
	* {
		box-sizing: border-box;
		margin: 0;
		padding: 0;
		font-family: 'Poppins', sans-serif;
	}

	body {
		background: linear-gradient(135deg, #4A90E2, #50E3C2);
		display: flex;
		justify-content: center;
		align-items: center;
		height: 100vh;
		padding: 20px;
	}

	.container {
       width: 100%;
       background: white;
       padding: 25px;
       box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
       border-radius: 10px;
       text-align: center;
       animation: fadeIn 0.5s ease-in-out;
	}

	@keyframes fadeIn {
		from { opacity: 0; transform: translateY(-20px); }
		to { opacity: 1; transform: translateY(0); }
	}

	h2 {
		color: #333;
		margin-bottom: 10px;
	}

	h3 {
		color: #4A90E2;
		margin-bottom: 15PX;
	}

	input {
		width: 100%;
		padding: 10px;
		margin: 10px 0;
		border: 1px solid #ddd;
		border-radius: 5px;
		font-size: 16px;
		outline: none;
	}

	input:focus {
		border-color: #4A90E2;
		box-shadow: 0px 0px 5px rgba(74, 144, 226, 0.5);
	}

	button {
		width: 100%;
		padding: 12px;
		background: #4A90E2;
		color: white;
		border: none;
		font-size: 16px;
		cursor: pointer;
		border-radius: 5px;
		transition: 0.3s;
	}

	button:hover {
		background: #357ABD;
	}

	.message {
		color: red;
		font-size: 14px;
		margin-top: 10px;
	}

	.toggle {
		color: #4A90E2;
		cursor: pointer;
		font-size: 14px;
		margin-top: 10px;
		display: block;
	}

	@media (max-width: 480px) {
		body{
			padding: 10px;
		}
		.container {
			padding: 20px;
		}
	}

</style>

<body>
<div class="container">
	<h2>Secure Login and Register</h2>

	<!-- Registration Form -->
	<div id="registerForm">
		<h3>Create an Account</h3>
		<input type="email" id="regEmail" placeholder="Add your Email" required>
		<input type="tex" id="regUsername" placeholder="Add a Username" required>
		<input type="password" id="regPassword" placeholder="Create your Password" required>
		<button onclick="registerUser()">Register</button>
		<p id="registerMessage" class="message"></p>
		<span class="toggle" onclick="toggleForms()">Already have an account ? Login here</span>
	</div>

<!-- Login Form -->
<div id="loginForm" style="display: none;">
<h3>Login</h3>
<input type="email" id="loginEmail" placeholder="Add your Email" required>
<input type="password" id="loginPassword" placeholder="Add your Password" required>	
<button onclick="loginUser()">Login</button>
<p id="loginMessage" class="message"></p>
<span class="toggle" onclick="toggleForms()">New User ? Register here</span>
     </div>
</div>

<script type="text/javascript">
	function toggleForms() {
		document.getElementById("registerForm").style.display =
		document.getElementById("registerForm").style.display === "none" ? "block" : "none";
		document.getElementById("loginForm").style.display =
		document.getElementById("loginForm").style.display === "none" ? "block" : "none";
	}

	function registerUser() {
		var email = document.getElementById("regEmail").value;
		var username = document.getElementById("regUsername").value;
		var password = document.getElementById("regPassword").value;

		if (!email || !username || !password) {
			document.getElementById("registerMessage").innerText = "All fields are required!";
			return;
		}

		google.script.run.withSuccessHandler(function(response) {
			if (response === "success") {
				alert("You are registered successfully!"); // Pop-up window
				toggleForms(); // Switch to login form
			} else {
				document.getElementById("registerMessage").innerText = response; // Show error messages
			}
		}).registerUser(email, username, password);
	} 


	function loginUser() {
		var email = document.getElementById("loginEmail").value.trim();
		var password = document.getElementById("loginPassword").value.trim();

		if (!email || !password) {
			document.getElementById("loginMessage").innerHTML = "Please add your email and password";
			return;
		}

		google.script.run.withSuccessHandler(function(response) {
			if (response.indexOf("<!DOCTYPE html>") !== -1) {
				document.open();
				document.write(response);
				document.close();
			} else {
				document.getElementById("loginMessage").innerHTML = response;
			}
		})
		.withFailureHandler(function(error) {
			document.getElementById("loginMessage").innerHTML = "Error logging in!";
			console.error(error);
		})
		.loginUser(email, password);
	}
</script>

</body>
</html>
